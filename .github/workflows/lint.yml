name: Lint

on:
  # ⛔ NO `push: branches: [main]`. Every commit reaches main through a pull request that
  #   this same workflow already linted and that the branch ruleset required to be green
  #   (`Shell` and `Docs`), so the post-merge run re-linted a tree it had just cleared.
  #   Every push-event run in the 7 days to 2026-09-22 was on main, and every one of them
  #   was the squash of a PR Lint had already passed.
  pull_request:
    branches: [main]

permissions:
  contents: read

# ★ WAS ABSENT, AND IT SHOWED. Runs 35670075774 and 35670080066 were both push/main, created
#   THREE SECONDS APART on 2026-09-22T00:00, and BOTH ran to conclusion — neither superseded
#   the other, so the repo paid twice for one answer. ci.yml in the private repos has carried
#   this group for months; this file never got it.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # scandir "." so configs/scripts/ is covered, not just scripts/
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning

      - name: shfmt
        run: docker run --rm -v "$PWD:/w" -w /w mvdan/shfmt:v3 -i 4 -sr -d .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"

      - name: typos
        uses: crate-ci/typos@v1.50.2

      # --offline: repo-local paths only, no network flake
      - name: Links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress "**/*.md"
          fail: true
